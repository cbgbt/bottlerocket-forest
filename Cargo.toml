[workspace]
resolver = "2"
members = [
    "crates/brdev",
    "crates/forester",
    "crates/*",
]
default-members = ["crates/brdev", "crates/forester"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
crumbly-core = { path = "crates/crumbly-core", version = "0.1" }

# CLI and parsing
clap = { version = "4", features = ["derive", "color"] }
clap-cargo = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
miette = { version = "7", features = ["fancy"] }
snafu = "0.8"
tracing = "0.1"

# Builders and types
bon = "3"
nutype = { version = "0.5", features = ["serde"] }

# Embeddings and ML
fastembed = { version = "4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
tokenizers = { version = "0.22", features = ["http", "rustls-tls"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
sqlite-vec = "0.1"

# Cryptography
sha2 = "0.10"

# Text processing
text-splitter = { version = "0.28", features = ["markdown", "tokenizers"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tree-sitter = "0.24"
tree-sitter-go = "0.23"

# File system and paths
globset = "0.4"
ignore = "0.4"
path-clean = "1"
pathdiff = "0.2"
dirs = "5"

# Concurrency
rayon = "1"

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Time and dates
chrono = { version = "0.4", features = ["serde"] }
timeago = "0.4"

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# UI and progress
indicatif = { version = "0.17", features = ["rayon"] }
owo-colors = { version = "4", features = ["supports-colors"] }

# Configuration
dotenvy = "0.15"
envy = "0.4"

# Linting
inventory = "0.3"
walkdir = "2"

# Testing
assert_cmd = "2"
mockall = "0.13"
serial_test = "3"
tempfile = "3"
test-case = "3"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"
