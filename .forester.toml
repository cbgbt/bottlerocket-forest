# Forester configuration for bottlerocket-forest
#
# This file configures which directories forester should index for semantic search
# and provides fine-grained control over what gets indexed.

# File types to index (default: ["markdown", "rust"])
enabled-file-types = ["markdown", "rust"]

# Directories to scan
targets = [
    "docs",
    "skills",
    "bottlerocket",
    "kits",
    "twoliter",
    "sdk",
    "host-containers",
    "bottlerocket-settings-sdk",
]

# Rust-specific indexing controls
[file-types.rust]
# Which visibility levels to index (default: ["public"])
# Options: "public", "crate", "private"
visibility = ["public"]

# Which item types to index (default: ["all"])
# Options: "all", "modules", "functions", "structs", "enums", "traits", "impls", "type-aliases", "constants"
items = ["modules"]

# Minimum doc comment length in characters (default: 0)
min-doc-lines = 4
